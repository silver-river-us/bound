name: Refresh architecture with agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: architecture-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask the agent to inspect and refresh architecture specs
        uses: openai/codex-action@v1
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Read .github/architecture-agent.md and todo.md. Inspect the current
            repository and refresh the existing .bo/.bom architecture files only
            when the source proves they are stale. Do not redesign the system.
            Run the documented tests and checks. Leave a concise summary of
            changed architecture facts in ARCHITECTURE_REFRESH.md. If there is
            nothing evidence-based to change, leave the working tree clean.

      - name: Create a reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/architecture-refresh
          delete-branch: true
          title: "chore: refresh architecture specifications"
          commit-message: "chore: refresh architecture specifications"
          body: |
            Automated architecture refresh generated by the Bound agent.

            The agent was instructed to update only source-backed `.bo`/`.bom`
            facts and to run the repository checks. Please review every
            architecture change before merging.
          add-paths: |
            **/*.bo
            **/*.bom
            ARCHITECTURE_REFRESH.md
            todo.md

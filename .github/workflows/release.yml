name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI archives and package skill
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a heading for ${version} before release" >&2
            exit 1
          fi
          mkdir -p dist

          while read -r os arch extension; do
            archive="bound-${version}-${os}-${arch}"
            binary="${archive}/bound"
            if [ "${extension}" = "zip" ]; then
              binary="${binary}.exe"
            fi
            mkdir -p "${archive}"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -o "${binary}" ./src
            printf '%s\n' "Bound ${RELEASE_TAG}" > "${archive}/VERSION"
            if [ "${extension}" = "zip" ]; then
              (cd "${archive}" && zip -q -r "../dist/${archive}.zip" .)
            else
              tar -czf "dist/${archive}.tar.gz" "${archive}"
            fi
            rm -rf "${archive}"
          done <<'TARGETS'
          linux amd64 tar.gz
          linux arm64 tar.gz
          darwin amd64 tar.gz
          darwin arm64 tar.gz
          windows amd64 zip
          TARGETS

          skill_archive="dist/bound-architecture-specs-${version}.tar.gz"
          tar -czf "${skill_archive}" -C integrations/skills bound-architecture-specs
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
